[tox]
envlist = py, pre-commit

[testenv]
deps =
    flake8
    pytest
    responses
    Jinja2
    sphinx < 7.0
    sphinx_rtd_theme
usedevelop = true
commands =
    {envpython} -m pytest --strict-markers {posargs:tests/}
    {envpython} -m sphinx.cmd.build -b html -d {envtmpdir}/doctrees docs {envtmpdir}/docs/_build/

[testenv:pre-commit]
skip_install = true
deps = pre-commit
commands =
    pre-commit run --all-files --show-diff-on-failure

[pytest]
markers =
    regenerate_rendered_specs

[flake8]
# The following are ignored since they conflict with black
#
# E123 closing bracket does not match indentation of opening bracket's line
# E241 multiple spaces after ':'
# E226 missing whitespace around arithmetic operator
# W503 line break before binary operator
#
# The following are ignored since we disagree with them
#
# F541 f-string is missing placeholders
ignore = E123, E241, E226, W503, F541
max-line-length = 99
